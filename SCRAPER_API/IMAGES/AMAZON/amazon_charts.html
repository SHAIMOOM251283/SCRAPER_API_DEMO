<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Analytics Dashboard</title>

    <!-- Link to main CSS -->
    <link rel="stylesheet" href="../../../styles.css">

    <style>
        /* Layout container */
        .dashboard-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Dashboard intro */
        .dashboard-intro {
            color: #aed8fa;
            text-shadow: 0 0 8px rgba(178, 225, 245, 0.4);
            margin-bottom: 15px;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            min-width: 250px;   /* FIX: sidebar never shrinks */
            max-width: 250px;   /* FIX: sidebar never grows */
            flex-shrink: 0;     /* FIX: prevents shrinking in flex layout */
            background: #001d3d;
            border-right: 2px solid #003566;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            color: #9bd4ff;
            margin-bottom: 15px;
        }

        .sidebar a {
            padding: 14px 20px;
            text-decoration: none;
            color: #c9e6ff;
            font-size: 1rem;
            border-bottom: 1px solid rgba(0, 153, 255, 0.15);
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #003566;
            color: #00eaff;
            padding-left: 28px;
        }

        /* Main content */
        .main-view {
            flex-grow: 1;
            flex-shrink: 1;  /* main view is flexible */
            background: #000814;
            padding: 20px;
            overflow-y: auto;
        }

        .main-view h1 {
            color: #e8f7ff;
            text-shadow: 0 0 12px #009dff;
        }

        iframe {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 174, 255, 0.3);
            margin-top: 20px;
        }

        .chart-description {
            margin-top: 20px;
            padding: 12px 20px;
            background: rgba(0, 29, 61, 0.6);
            border-radius: 10px;
            color: #9bd4ff;
            font-size: 1rem;
            text-align: left;
            box-shadow: 0 0 12px rgba(0, 174, 255, 0.2);
        }

        .home-btn {
            margin: 20px;
            padding: 12px 20px;
            background: #001d3d;
            color: #00d1ff;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 174, 255, 0.4);
        }

        .home-btn:hover {
            background: #003566;
            color: #00eaff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px #00c8ff;
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <nav class="sidebar">
        <h2>Amazon Insights</h2>
        <a href="bar_chart.html" target="chartFrame">Bar Chart</a>
        <a href="dual_axis_chart.html" target="chartFrame">Dual Axis Chart</a>
        <a href="pie_chart.html" target="chartFrame">Pie Chart</a>
        <a href="sankey_diagram.html" target="chartFrame">Sankey Diagram</a>
        <a href="wordcloud.html" target="chartFrame">Wordcloud</a>
        <a href="../../../index.html" class="home-btn">🏠 Home</a>
    </nav>

    <!-- Main Chart Area -->
    <div class="main-view">
        <h1>Amazon Analytics Dashboard</h1>
        
        <p class="dashboard-intro">
            These visualizations are generated using product data extracted from Amazon via ScraperAPI.
        </p>

        <!-- Chart displays here -->
        <iframe name="chartFrame"></iframe>

        <!-- Chart description -->
        <div class="chart-description" id="chartDescription">
            <p>Select a chart from the sidebar to see details here.</p>
        </div>
    </div>

</div>

<!-- JavaScript -->
<script>
    const chartLinks = document.querySelectorAll('.sidebar a[target="chartFrame"]');
    const description = document.getElementById('chartDescription');

    chartLinks.forEach(link => {
        link.addEventListener('click', () => {
            const chartName = link.textContent;
            switch(chartName) {
                case 'Bar Chart':
                    description.innerHTML = `
                        <p>
                            The Bar Chart visualizes the percentage distribution of customer star ratings (1 to 5 stars) for a Lenovo product. 
                            Each bar represents the proportion of reviews at a specific rating level, enabling a clear 
                            comparison of user satisfaction.
                        </p>`;
                    break;
                case 'Dual Axis Chart':
                    description.innerHTML = `
                        <p>
                            The Dual-Axis Chart displays both the estimated number of reviews and their corresponding percentage for each star rating. 
                            The left y-axis shows the review count as bars, while the right y-axis shows the percentage as a line plot, 
                            providing a detailed view of both the volume and proportion of customer feedback.
                        </p>`;
                    break;
                case 'Pie Chart':
                    description.innerHTML = `
                        <p>
                            The Pie Chart shows the relative proportions of each star rating in a circular format. 
                            It highlights how customer reviews are distributed across the five rating levels, giving a quick snapshot of overall product sentiment.
                        </p>`;
                    break;
                case 'Sankey Diagram':
                    description.innerHTML = `
                        <p>
                            The Sankey Diagram depicts the hierarchical flow of Lenovo products across three levels: Category, Brand and Series. 
                            Each node represents a unique value from these levels and the links between them illustrate how many products transition from one level to the next. 
                            The width of each link is proportional to the number of products, providing a clear visual representation of how products are distributed from broader categories to specific series.
                        </p>`;
                    break;
                case 'Wordcloud':
                    description.innerHTML = `
                        <p>
                            The Word Cloud visually represents the most frequent terms found in the product feature bullets and full descriptions of products. 
                            Words that appear more often are shown in larger font, offering a quick overview of key features and common terms associated with the products.
                        </p>`;
                    break;
            }
        });
    });
</script>

</body>
</html>
