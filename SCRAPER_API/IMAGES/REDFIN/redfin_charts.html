<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redfin Analytics Dashboard</title>

    <!-- Link to main CSS -->
    <link rel="stylesheet" href="../../styles.css">

    <style>
        /* Layout container */
        .dashboard-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Dashboard intro */
        .dashboard-intro {
            color: #aed8fa;
            text-shadow: 0 0 8px rgba(178, 225, 245, 0.4);
            margin-bottom: 15px;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            min-width: 250px;   /* FIX: sidebar never shrinks */
            max-width: 250px;   /* FIX: sidebar never grows */
            flex-shrink: 0;     /* FIX: prevents shrinking in flex layout */
            background: #001d3d;
            border-right: 2px solid #003566;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            color: #9bd4ff;
            margin-bottom: 15px;
        }

        .sidebar a {
            padding: 14px 20px;
            text-decoration: none;
            color: #c9e6ff;
            font-size: 1rem;
            border-bottom: 1px solid rgba(0, 153, 255, 0.15);
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #003566;
            color: #00eaff;
            padding-left: 28px;
        }

        /* Main content */
        .main-view {
            flex-grow: 1;
            flex-shrink: 1;  /* main view is flexible */
            background: #000814;
            padding: 20px;
            overflow-y: auto;
        }

        .main-view h1 {
            color: #e8f7ff;
            text-shadow: 0 0 12px #009dff;
        }

        iframe {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 174, 255, 0.3);
            margin-top: 20px;
        }

        .chart-description {
            margin-top: 20px;
            padding: 12px 20px;
            background: rgba(0, 29, 61, 0.6);
            border-radius: 10px;
            color: #9bd4ff;
            font-size: 1rem;
            text-align: left;
            box-shadow: 0 0 12px rgba(0, 174, 255, 0.2);
        }

        .home-btn {
            margin: 20px;
            padding: 12px 20px;
            background: #001d3d;
            color: #00d1ff;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 174, 255, 0.4);
        }

        .home-btn:hover {
            background: #003566;
            color: #00eaff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px #00c8ff;
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <nav class="sidebar">
        <h2>Redfin Insights</h2>
        <a href="box_plot.html" target="chartFrame">Box Plot</a>
        <a href="scatter_map.html" target="chartFrame">Scatter Map</a>
        <a href="scatter_plot.html" target="chartFrame">Scatter Plot</a>
        <a href="sunburst_chart.html" target="chartFrame">Sunburst Chart</a>
        <a href="treemap.html" target="chartFrame">Treemap</a>
        <a href="../../../index.html" class="home-btn">🏠 Home</a>
    </nav>

    <!-- Main Chart Area -->
    <div class="main-view">
        <h1>Redfin Analytics Dashboard</h1>
        
        <p class="dashboard-intro">
            These visualizations are generated using data extracted from Redfin via ScraperAPI.
        </p>

        <!-- Chart displays here -->
        <iframe name="chartFrame"></iframe>

        <!-- Chart description -->
        <div class="chart-description" id="chartDescription">
            <p>Select a chart from the sidebar to see details here.</p>
        </div>
    </div>

</div>

<!-- JavaScript -->
<script>
    const chartLinks = document.querySelectorAll('.sidebar a[target="chartFrame"]');
    const description = document.getElementById('chartDescription');

    chartLinks.forEach(link => {
        link.addEventListener('click', () => {
            const chartName = link.textContent;
            switch(chartName) {
                case 'Box Plot':
                    description.innerHTML = `
                        <p>
                            This box plot provides a statistical overview of price per square foot across different property types in New York City. 
                            Each box summarizes the distribution of prices within a category—showing the median, interquartile range (IQR) and potential outliers. 
                            Individual property data points are also displayed to reveal the spread and variability within each group. 
                            This visualization enables a quick comparison of pricing trends among various property types.
                        </p>`;
                    break;
                case 'Scatter Map':
                    description.innerHTML = `
                        <p>
                            The scatter map visualizes the geographic distribution of property listings across New York City, with each point representing a property’s location. 
                            The color of each point reflects the sale price, while the size indicates the square footage of the property. 
                            This interactive map provides a spatial overview of pricing patterns and property sizes, helping to identify regional trends in the NYC real estate market.
                        </p>`;
                    break;
                case 'Scatter Plot':
                    description.innerHTML = `
                        <p>
                            The scatter plot illustrates the relationship between square footage and sale price of properties in New York City. 
                            Each point represents a property, with the color indicating its type and the bubble size reflecting its price per square foot. 
                            This visualization helps identify pricing patterns and property types across various size ranges, offering insights into market trends and value distribution.
                        </p>`;
                    break;
                case 'Sunburst Chart':
                    description.innerHTML = `
                        <p>
                            The sunburst chart visualizes the hierarchical breakdown of property prices in New York City across three levels: Property Type, Number of Bedrooms and Number of Bathrooms. 
                            The inner rings represent broader categories, while the outer rings show more specific details. 
                            The size of each segment corresponds to the total property price within that category and the color intensity reflects price levels. 
                            This visualization provides an intuitive way to explore how property prices vary across different configurations.
                        </p>`;
                    break;
                case 'Treemap':
                    description.innerHTML = `
                        <p>
                            The treemap visualizes the distribution of property prices across different property types and bedroom counts. 
                            Each rectangle represents a unique combination of property type and number of beds, with the size indicating the total price and the color reflecting price intensity. 
                            This chart provides a clear hierarchical view of how property prices vary based on type and bedroom configuration in the NYC housing market.
                        </p>`;
                    break;
            }
        });
    });
</script>

</body>
</html>
